[package]
name = "inferlib2-context"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "inferlib2_context"

[dependencies]
wit-bindgen = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minijinja = { version = "2.5", features = ["loader"] }

# Import bindings from engine instead of regenerating
inferlib2-engine-bindings = { path = "../engine-bindings" }
