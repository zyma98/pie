[package]
name = "inferlib-inference"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "inferlib_inference"

[dependencies]
inferlib-engine-bindings = { path = "../engine-bindings" }
wit-bindgen = { workspace = true }
wstd = "0.5.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minijinja = { version = "2.5", features = ["loader"] }
