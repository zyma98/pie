[package]
name = "inferlib-template"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "inferlib_template"

[dependencies]
wit-bindgen = { workspace = true }
inferlib-macros = { path = "../../inferlib-macros" }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
serde_json = "1"
