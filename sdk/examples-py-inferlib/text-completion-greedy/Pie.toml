[package]
name = "text-completion-greedy"
version = "0.1.0"
description = "Text completion with greedy (deterministic) sampling (Python)"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"
mcp = "^0.2.0"
python-runtime = "^0.2.0"

[parameters]
prompt = {type = "string", optional = true, description = "The user message to complete (default: 'Explain what makes a good unit test in three concise points.')"}
system = {type = "string", optional = true, description = "System prompt to set assistant behavior (default: 'You are a helpful, respectful and honest assistant.')"}
max_tokens = {type = "int", optional = true, description = "Maximum number of tokens to generate (default: 256)"}

[dependencies]
inferlib-inference = "0.1.0"
